<?xml version="1.0" encoding="UTF-8"?>
<!-- Full-bleed opaque iOS artwork; the OS supplies the icon mask. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="96 96 832 832" width="1024" height="1024" fill="none" aria-label="Chord Runner">
  <defs>
    <!-- macOS Dock Scale Squircle Clip -->
    <clipPath id="squircle-clip">
      <rect x="96" y="96" width="832" height="832" />
    </clipPath>

    <!-- Background Radial Gradient -->
    <radialGradient id="bg-grad" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#181330" />
      <stop offset="65%" stop-color="#0A0818" />
      <stop offset="100%" stop-color="#020106" />
    </radialGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.5" />
    </linearGradient>

    <!-- 4 Bar Loop Segment Gradients -->
    <!-- Bar 1: Root (Cyan to Azure) -->
    <linearGradient id="bar-arc-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <!-- Bar 2: Second Chord (Indigo to Electric Violet) -->
    <linearGradient id="bar-arc-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <!-- Bar 3: Third Chord (Fuchsia to Crimson) -->
    <linearGradient id="bar-arc-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <!-- Bar 4: Fourth Chord (Coral to Solar Amber) -->
    <linearGradient id="bar-arc-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- 3D Bevel Sheen -->
    <linearGradient id="ring-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="dock-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="32" stdDeviation="28" flood-color="#000000" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="ring-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="glow-warp" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Squircle with Native macOS Drop Shadow -->
  <g>
    <rect x="96" y="96" width="832" height="832" fill="url(#bg-grad)" />
  </g>

  <!-- Clipped Interior Contents -->
  <g clip-path="url(#squircle-clip)">
    <!-- Central Sub-bass Core Ambient Glow -->
    <ellipse cx="512" cy="512" rx="260" ry="170" fill="#8B5CF6" opacity="0.22" filter="blur(50px)" transform="rotate(-20 512 512)" />

    <!-- 3D Tilted Loop Vortex (4 Chord Progression Segments) -->
    <g filter="url(#ring-depth)" transform="rotate(-22 512 512)">
      <!-- Back Rim Tube (Depth layer) -->
      <ellipse cx="512" cy="512" rx="280" ry="185" fill="none" stroke="#111827" stroke-width="68" />

      <!-- Arc 1 (Bar 1: Root Chord - Top-Right) -->
      <path d="M 512,327 A 280 185 0 0 1 772,455" fill="none" stroke="url(#bar-arc-1)" stroke-width="62" stroke-linecap="round" />
      <!-- Arc 1 Sheen -->
      <path d="M 512,327 A 280 185 0 0 1 772,455" fill="none" stroke="url(#ring-sheen)" stroke-width="10" stroke-linecap="round" transform="translate(0, -10)" opacity="0.8" />

      <!-- Arc 2 (Bar 2: Second Chord - Bottom-Right) -->
      <path d="M 762,538 A 280 185 0 0 1 538,695" fill="none" stroke="url(#bar-arc-2)" stroke-width="62" stroke-linecap="round" />
      <!-- Arc 2 Sheen -->
      <path d="M 762,538 A 280 185 0 0 1 538,695" fill="none" stroke="url(#ring-sheen)" stroke-width="10" stroke-linecap="round" transform="translate(0, -10)" opacity="0.6" />

      <!-- Arc 3 (Bar 3: Third Chord - Bottom-Left) -->
      <path d="M 464,695 A 280 185 0 0 1 254,556" fill="none" stroke="url(#bar-arc-3)" stroke-width="62" stroke-linecap="round" />
      <!-- Arc 3 Sheen -->
      <path d="M 464,695 A 280 185 0 0 1 254,556" fill="none" stroke="url(#ring-sheen)" stroke-width="10" stroke-linecap="round" transform="translate(0, -10)" opacity="0.6" />

      <!-- Arc 4 (Bar 4: Fourth Chord - Top-Left) -->
      <path d="M 260,464 A 280 185 0 0 1 482,329" fill="none" stroke="url(#bar-arc-4)" stroke-width="62" stroke-linecap="round" />
      <!-- Arc 4 Sheen -->
      <path d="M 260,464 A 280 185 0 0 1 482,329" fill="none" stroke="url(#ring-sheen)" stroke-width="10" stroke-linecap="round" transform="translate(0, -10)" opacity="0.75" />

      <!-- Inner Concentric Harmonic Waveguide -->
      <ellipse cx="512" cy="512" rx="168" ry="102" fill="none" stroke="#FFFFFF" stroke-width="3.5" stroke-dasharray="16 10" opacity="0.35" />
    </g>

    <!-- High-Speed Playhead Runner Particle Orbiting the Track -->
    <g filter="url(#glow-warp)">
      <!-- Motion streak -->
      <path d="M 630,340 C 735,375 790,475 725,585" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" opacity="0.85" />
      <path d="M 630,340 C 735,375 790,475 725,585" fill="none" stroke="#38BDF8" stroke-width="22" stroke-linecap="round" opacity="0.45" />

      <!-- Leading Photon / Runner -->
      <circle cx="725" cy="585" r="18" fill="#FFFFFF" />
      <circle cx="725" cy="585" r="38" fill="#38BDF8" opacity="0.55" />
      <circle cx="725" cy="585" r="58" fill="#6366F1" opacity="0.3" />
    </g>
  </g>
</svg>
