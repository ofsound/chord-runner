name: Chord Runner
on:
  workflow_dispatch:
  pull_request:
    paths-ignore: ['**.md', 'docs/**']
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
permissions:
  contents: read
concurrency:
  group: chord-runner-${{ github.ref }}
  cancel-in-progress: true
jobs:
  macos:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Ninja
        run: brew install ninja
      - name: Configure
        run: cmake -B Builds -G Ninja -DCMAKE_BUILD_TYPE=Debug -DCHORD_RUNNER_COPY_PLUGINS=OFF
      - name: Build all native formats
        run: cmake --build Builds --parallel 3
      - name: Test
        run: ctest --test-dir Builds --output-on-failure
      - name: Archive development builds
        run: ditto -c -k --keepParent Builds/ChordRunner_artefacts/Debug ChordRunner-macOS.zip
      - uses: actions/upload-artifact@v7
        with:
          name: ChordRunner-macOS-Debug
          path: ChordRunner-macOS.zip
# Development CI only. No IPP, release publishing, certificates, or notarization.
