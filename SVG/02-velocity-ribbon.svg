<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-v2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1326" />
      <stop offset="50%" stop-color="#080B14" />
      <stop offset="100%" stop-color="#04050A" />
    </linearGradient>

    <!-- Squircle Border -->
    <linearGradient id="border-v2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.4" />
    </linearGradient>

    <!-- Ribbon Outer Tier 1 (Root - Deep Indigo to Vivid Violet) -->
    <linearGradient id="ribbon-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#C026D3" />
    </linearGradient>

    <!-- Ribbon Mid Tier 2 (Third - Hot Magenta to Sunset Coral) -->
    <linearGradient id="ribbon-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- Ribbon Inner Tier 3 (Fifth - Neon Amber to Electric Cyan) -->
    <linearGradient id="ribbon-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="60%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- 3D Ribbon Under-Turn Shadows (Ambient Occlusion) -->
    <linearGradient id="fold-shadow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#000000" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>

    <!-- Specular Highlight Line -->
    <linearGradient id="spec-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0" />
    </linearGradient>

    <filter id="shadow-v2" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="ribbon-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="glow-core" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="25" />
    </filter>
  </defs>

  <!-- Base Squircle -->
  <g filter="url(#shadow-v2)">
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-v2)" />
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="url(#border-v2)" stroke-width="3" />
  </g>

  <!-- Ambient Internal Core Glow -->
  <circle cx="256" cy="256" r="100" fill="#6366F1" opacity="0.25" filter="url(#glow-core)" />

  <!-- 3D Sweeping Twisted Chord Stream -->
  <g filter="url(#ribbon-depth)">
    <!-- Back Turns (Behind) -->
    <path d="M 330,150 C 370,180 390,230 380,290 C 370,350 320,400 240,400 C 160,400 110,340 110,260 C 110,180 165,120 250,110" 
          fill="none" stroke="url(#ribbon-1)" stroke-width="36" stroke-linecap="round" opacity="0.45" />

    <!-- Harmonic Band 1 (Outer Chord Track: Bass) -->
    <path d="M 360,165 C 290,105 160,115 120,195 C 75,280 120,380 230,390 C 330,400 395,335 390,250 C 385,185 320,175 250,220" 
          fill="none" stroke="url(#ribbon-1)" stroke-width="26" stroke-linecap="round" />

    <!-- Ambient Shadow Under-fold -->
    <path d="M 230,225 C 260,205 310,190 350,220" 
          fill="none" stroke="#000000" stroke-width="32" opacity="0.6" filter="blur(6px)" />

    <!-- Harmonic Band 2 (Mid Chord Track: 3rd / Melody) -->
    <path d="M 340,180 C 285,130 175,140 145,210 C 110,280 150,355 235,360 C 315,365 365,315 360,255 C 355,200 300,205 240,240" 
          fill="none" stroke="url(#ribbon-2)" stroke-width="18" stroke-linecap="round" />

    <!-- Harmonic Band 3 (Inner Chord Track: 5th / Lead) -->
    <path d="M 320,195 C 280,155 195,165 170,220 C 145,275 175,330 235,335 C 295,340 335,300 330,260 C 325,225 285,225 245,255" 
          fill="none" stroke="url(#ribbon-3)" stroke-width="12" stroke-linecap="round" />

    <!-- Specular Highlight Streaks along the crest -->
    <path d="M 130,210 C 100,270 125,360 220,385" 
          fill="none" stroke="url(#spec-glow)" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 155,220 C 135,265 150,335 225,355" 
          fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.9" />

    <!-- Forward Velocity Arrowhead / Playhead Tip -->
    <g transform="translate(245, 255) rotate(-35)">
      <polygon points="0,0 -16,-10 -12,0 -16,10" fill="#FFFFFF" opacity="0.95" />
      <polygon points="4,0 -14,-12 -8,0 -14,12" fill="#38BDF8" opacity="0.5" filter="blur(2px)" />
    </g>
  </g>
</svg>
