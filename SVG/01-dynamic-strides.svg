<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-glow" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#1E1B4B" />
      <stop offset="60%" stop-color="#0F0F1A" />
      <stop offset="100%" stop-color="#07070C" />
    </radialGradient>

    <!-- Squircle Border Gradient -->
    <linearGradient id="border-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.25" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.8" />
    </linearGradient>

    <!-- Monolith Gradients (Front Faces) -->
    <linearGradient id="front-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="front-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>

    <linearGradient id="front-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#D946EF" />
    </linearGradient>

    <linearGradient id="front-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Side 3D Bevel Gradients -->
    <linearGradient id="side-1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#0369A1" />
    </linearGradient>
    <linearGradient id="side-2" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#3730A3" />
    </linearGradient>
    <linearGradient id="side-3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BE185D" />
      <stop offset="100%" stop-color="#831843" />
    </linearGradient>
    <linearGradient id="side-4" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B45309" />
      <stop offset="100%" stop-color="#78350F" />
    </linearGradient>

    <!-- Top Cap Highlights -->
    <linearGradient id="top-1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#CFFAFE" />
    </linearGradient>
    <linearGradient id="top-2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#EEF2FF" />
    </linearGradient>
    <linearGradient id="top-3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="100%" stop-color="#FCE7F3" />
    </linearGradient>
    <linearGradient id="top-4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#FEF9C3" />
    </linearGradient>

    <!-- Sweeping Playhead Beam -->
    <linearGradient id="sweep-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </linearGradient>

    <!-- Filters -->
    <filter id="icon-shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="pillar-shadow" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <filter id="laser-glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Icon Squircle Canvas -->
  <g filter="url(#icon-shadow)">
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-glow)" />
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="url(#border-grad)" stroke-width="3" />
  </g>

  <!-- Ambient Light Reflection on Floor -->
  <ellipse cx="256" cy="380" rx="160" ry="40" fill="#6366F1" opacity="0.18" filter="blur(20px)" />

  <!-- 3D Stepped Chord Strides (Progressing forward in perspective) -->
  <g filter="url(#pillar-shadow)">
    <!-- Column 1 (Bass/Root) -->
    <g transform="translate(92, 230)">
      <!-- Shadow/Side Face -->
      <path d="M 44,0 L 56,12 L 56,140 L 44,130 Z" fill="url(#side-1)" />
      <!-- Top Cap -->
      <polygon points="0,0 12,-12 56,-12 44,0" fill="url(#top-1)" />
      <!-- Front Face -->
      <rect x="0" y="0" width="44" height="130" rx="8" fill="url(#front-1)" />
      <!-- Inner Sheen -->
      <line x1="4" y1="2" x2="4" y2="128" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.4" stroke-linecap="round" />
    </g>

    <!-- Column 2 (Third) -->
    <g transform="translate(168, 175)">
      <!-- Side Face -->
      <path d="M 44,0 L 56,12 L 56,195 L 44,185 Z" fill="url(#side-2)" />
      <!-- Top Cap -->
      <polygon points="0,0 12,-12 56,-12 44,0" fill="url(#top-2)" />
      <!-- Front Face -->
      <rect x="0" y="0" width="44" height="185" rx="8" fill="url(#front-2)" />
      <!-- Inner Sheen -->
      <line x1="4" y1="2" x2="4" y2="183" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.45" stroke-linecap="round" />
    </g>

    <!-- Column 3 (Fifth) -->
    <g transform="translate(244, 120)">
      <!-- Side Face -->
      <path d="M 44,0 L 56,12 L 56,250 L 44,240 Z" fill="url(#side-3)" />
      <!-- Top Cap -->
      <polygon points="0,0 12,-12 56,-12 44,0" fill="url(#top-3)" />
      <!-- Front Face -->
      <rect x="0" y="0" width="44" height="240" rx="8" fill="url(#front-3)" />
      <!-- Inner Sheen -->
      <line x1="4" y1="2" x2="4" y2="238" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.5" stroke-linecap="round" />
    </g>

    <!-- Column 4 (Seventh - Peak Runner) -->
    <g transform="translate(320, 80)">
      <!-- Side Face -->
      <path d="M 44,0 L 56,12 L 56,290 L 44,280 Z" fill="url(#side-4)" />
      <!-- Top Cap -->
      <polygon points="0,0 12,-12 56,-12 44,0" fill="url(#top-4)" />
      <!-- Front Face -->
      <rect x="0" y="0" width="44" height="280" rx="8" fill="url(#front-4)" />
      <!-- Inner Sheen -->
      <line x1="4" y1="2" x2="4" y2="278" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" />
    </g>
  </g>

  <!-- Dynamic Sweeping Diagonal Playhead / Velocity Blade -->
  <g filter="url(#laser-glow)">
    <path d="M 70,330 Q 256,260 410,130" stroke="url(#sweep-beam)" stroke-width="7" fill="none" stroke-linecap="round" />
    <circle cx="280" cy="235" r="9" fill="#FFFFFF" opacity="0.9" />
    <circle cx="280" cy="235" r="18" fill="#38BDF8" opacity="0.4" />
  </g>
</svg>
