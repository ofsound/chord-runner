<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-v4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A" />
      <stop offset="50%" stop-color="#080D1A" />
      <stop offset="100%" stop-color="#020408" />
    </linearGradient>

    <!-- Squircle Border -->
    <linearGradient id="border-v4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#6366F1" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#A855F7" stop-opacity="0.4" />
    </linearGradient>

    <!-- Lane Track Gradients (Sweeping curves) -->
    <linearGradient id="track-1" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22D3EE" />
    </linearGradient>

    <linearGradient id="track-2" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#818CF8" />
    </linearGradient>

    <linearGradient id="track-3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#9333EA" />
      <stop offset="50%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#C084FC" />
    </linearGradient>

    <linearGradient id="track-4" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E11D48" />
      <stop offset="50%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#FB7185" />
    </linearGradient>

    <!-- Capsule Core Gradients -->
    <radialGradient id="pod-1" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#67E8F9" />
      <stop offset="100%" stop-color="#0891B2" />
    </radialGradient>
    <radialGradient id="pod-2" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#A5B4FC" />
      <stop offset="100%" stop-color="#4F46E5" />
    </radialGradient>
    <radialGradient id="pod-3" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#E9D5FF" />
      <stop offset="100%" stop-color="#9333EA" />
    </radialGradient>
    <radialGradient id="pod-4" cx="30%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FECDD3" />
      <stop offset="100%" stop-color="#E11D48" />
    </radialGradient>

    <filter id="shadow-v4" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="lane-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <g filter="url(#shadow-v4)">
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-v4)" />
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="url(#border-v4)" stroke-width="3" />
  </g>

  <!-- Ambient Curve Backlight -->
  <path d="M 90,400 C 130,220 280,100 420,100" fill="none" stroke="#6366F1" stroke-width="60" opacity="0.12" filter="blur(25px)" />

  <!-- Banked 3D Multi-Voice Running Tracks -->
  <g filter="url(#lane-glow)">
    <!-- Track 1 (Bass Voice) -->
    <path d="M 85,395 C 135,260 255,145 425,120" fill="none" stroke="#042F2E" stroke-width="26" stroke-linecap="round" />
    <path d="M 85,395 C 135,260 255,145 425,120" fill="none" stroke="url(#track-1)" stroke-width="16" stroke-linecap="round" />
    <path d="M 85,395 C 135,260 255,145 425,120" fill="none" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Track 2 (Tenor Voice) -->
    <path d="M 120,415 C 170,285 285,180 435,165" fill="none" stroke="#1E1B4B" stroke-width="26" stroke-linecap="round" />
    <path d="M 120,415 C 170,285 285,180 435,165" fill="none" stroke="url(#track-2)" stroke-width="16" stroke-linecap="round" />
    <path d="M 120,415 C 170,285 285,180 435,165" fill="none" stroke="#EEF2FF" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Track 3 (Alto Voice) -->
    <path d="M 155,435 C 205,310 315,215 445,210" fill="none" stroke="#2E1065" stroke-width="26" stroke-linecap="round" />
    <path d="M 155,435 C 205,310 315,215 445,210" fill="none" stroke="url(#track-3)" stroke-width="16" stroke-linecap="round" />
    <path d="M 155,435 C 205,310 315,215 445,210" fill="none" stroke="#FAF5FF" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Track 4 (Soprano / Lead Voice) -->
    <path d="M 190,455 C 240,335 345,250 455,255" fill="none" stroke="#4C0519" stroke-width="26" stroke-linecap="round" />
    <path d="M 190,455 C 240,335 345,250 455,255" fill="none" stroke="url(#track-4)" stroke-width="16" stroke-linecap="round" />
    <path d="M 190,455 C 240,335 345,250 455,255" fill="none" stroke="#FFF1F2" stroke-width="3" stroke-linecap="round" opacity="0.8" />
  </g>

  <!-- High-Speed Harmonic Runners / Nodes Gliding Down the Track -->
  <g filter="url(#bloom)">
    <!-- Runner 1 -->
    <ellipse cx="290" cy="155" rx="16" ry="12" transform="rotate(-32 290 155)" fill="url(#pod-1)" />
    <!-- Runner 2 -->
    <ellipse cx="275" cy="225" rx="18" ry="13" transform="rotate(-36 275 225)" fill="url(#pod-2)" />
    <!-- Runner 3 -->
    <ellipse cx="260" cy="295" rx="20" ry="14" transform="rotate(-40 260 295)" fill="url(#pod-3)" />
    <!-- Runner 4 -->
    <ellipse cx="245" cy="365" rx="22" ry="15" transform="rotate(-44 245 365)" fill="url(#pod-4)" />

    <!-- Motion Velocity Vectors / Chord Strum Line Connecting Them -->
    <line x1="290" y1="155" x2="245" y2="365" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.9" />
    <line x1="290" y1="155" x2="245" y2="365" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" opacity="0.3" filter="blur(4px)" />
  </g>
</svg>
