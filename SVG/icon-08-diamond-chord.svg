<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg8" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1c1917"/>
      <stop offset="100%" stop-color="#0c0a09"/>
    </linearGradient>
    <linearGradient id="diamond8a" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <linearGradient id="diamond8b" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="diamond8c" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#b45309"/>
    </linearGradient>
    <linearGradient id="diamond8top" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="gem-glow8">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="gem-shadow8">
      <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#fbbf24" flood-opacity="0.4"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg8)"/>
  <!-- Ambient golden glow -->
  <circle cx="256" cy="240" r="160" fill="#fbbf24" opacity="0.04"/>
  <!-- Diamond gem shape - the main icon -->
  <g filter="url(#gem-shadow8)">
    <!-- Crown (top trapezoid) -->
    <path d="M256 80 L380 200 L256 200 Z" fill="url(#diamond8a)"/>
    <path d="M256 80 L132 200 L256 200 Z" fill="url(#diamond8top)"/>
    <!-- Pavilion (bottom triangle facets) -->
    <path d="M132 200 L256 420 L256 200 Z" fill="url(#diamond8b)"/>
    <path d="M380 200 L256 420 L256 200 Z" fill="url(#diamond8c)"/>
    <!-- Highlight edges -->
    <path d="M256 80 L380 200 L256 200 Z" fill="white" opacity="0.08"/>
    <line x1="132" y1="200" x2="380" y2="200" stroke="#fde68a" stroke-width="2" opacity="0.5"/>
    <!-- Internal facet lines -->
    <line x1="256" y1="80" x2="256" y2="420" stroke="#fde68a" stroke-width="1" opacity="0.2"/>
    <line x1="194" y1="200" x2="256" y2="420" stroke="#fde68a" stroke-width="1" opacity="0.15"/>
    <line x1="318" y1="200" x2="256" y2="420" stroke="#fde68a" stroke-width="1" opacity="0.15"/>
  </g>
  <!-- Musical staff lines through the diamond -->
  <g opacity="0.25">
    <line x1="100" y1="170" x2="412" y2="170" stroke="#fde68a" stroke-width="2"/>
    <line x1="100" y1="190" x2="412" y2="190" stroke="#fde68a" stroke-width="2"/>
    <line x1="100" y1="210" x2="412" y2="210" stroke="#fde68a" stroke-width="2"/>
    <line x1="100" y1="230" x2="412" y2="230" stroke="#fde68a" stroke-width="2"/>
    <line x1="100" y1="250" x2="412" y2="250" stroke="#fde68a" stroke-width="2"/>
  </g>
  <!-- Sparkle points -->
  <g fill="#fde68a">
    <circle cx="256" cy="100" r="3" opacity="0.8"/>
    <circle cx="200" cy="160" r="2" opacity="0.6"/>
    <circle cx="310" cy="175" r="2.5" opacity="0.7"/>
    <circle cx="240" cy="300" r="2" opacity="0.4"/>
    <circle cx="280" cy="350" r="1.5" opacity="0.3"/>
  </g>
</svg>
