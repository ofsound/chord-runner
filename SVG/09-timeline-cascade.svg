<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-v9" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#151728" />
      <stop offset="60%" stop-color="#0B0C15" />
      <stop offset="100%" stop-color="#030408" />
    </radialGradient>

    <!-- Squircle Border -->
    <linearGradient id="border-v9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.5" />
    </linearGradient>

    <!-- Tile 1 (Background / Bar 1: Deep Violet to Indigo) -->
    <linearGradient id="tile-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Tile 2 (Middle / Bar 2: Hot Fuchsia to Magenta) -->
    <linearGradient id="tile-grad-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="100%" stop-color="#BE123C" />
    </linearGradient>

    <!-- Tile 3 (Foreground / Bar 3 / Active: Solar Amber to Coral) -->
    <linearGradient id="tile-grad-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24" />
      <stop offset="50%" stop-color="#F97316" />
      <stop offset="100%" stop-color="#EF4444" />
    </linearGradient>

    <!-- Gloss Highlight Overlay -->
    <linearGradient id="tile-gloss" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.4" />
      <stop offset="40%" stop-color="#FFFFFF" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0.3" />
    </linearGradient>

    <filter id="shadow-v9" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="tile-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="-10" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="laser-glow-v9" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <g filter="url(#shadow-v9)">
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-v9)" />
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="url(#border-v9)" stroke-width="3" />
  </g>

  <!-- Ambient Glow Under Foreground Tile -->
  <circle cx="280" cy="310" r="110" fill="#F97316" opacity="0.25" filter="blur(30px)" />

  <!-- 3 Cascading 3D Timeline Chord Cards in Perspective -->
  <!-- Card 1 (Back / High Bar) -->
  <g filter="url(#tile-shadow)" transform="translate(100, 95) skewX(-14) scale(0.95)">
    <rect x="0" y="0" width="220" height="95" rx="18" fill="url(#tile-grad-1)" />
    <rect x="0" y="0" width="220" height="95" rx="18" fill="url(#tile-gloss)" />
    <rect x="0" y="0" width="220" height="95" rx="18" fill="none" stroke="#A5B4FC" stroke-width="2" stroke-opacity="0.6" />
    <!-- Chord Note Stripes -->
    <rect x="25" y="24" width="30" height="47" rx="8" fill="#FFFFFF" opacity="0.85" />
    <rect x="65" y="36" width="30" height="35" rx="8" fill="#FFFFFF" opacity="0.6" />
    <rect x="105" y="18" width="30" height="53" rx="8" fill="#FFFFFF" opacity="0.75" />
  </g>

  <!-- Card 2 (Middle Bar) -->
  <g filter="url(#tile-shadow)" transform="translate(145, 185) skewX(-14) scale(1.0)">
    <rect x="0" y="0" width="235" height="100" rx="20" fill="url(#tile-grad-2)" />
    <rect x="0" y="0" width="235" height="100" rx="20" fill="url(#tile-gloss)" />
    <rect x="0" y="0" width="235" height="100" rx="20" fill="none" stroke="#FDA4AF" stroke-width="2" stroke-opacity="0.7" />
    <!-- Chord Note Stripes -->
    <rect x="28" y="20" width="32" height="60" rx="8" fill="#FFFFFF" opacity="0.9" />
    <rect x="70" y="32" width="32" height="48" rx="8" fill="#FFFFFF" opacity="0.75" />
    <rect x="112" y="14" width="32" height="66" rx="8" fill="#FFFFFF" opacity="0.85" />
    <rect x="154" y="26" width="32" height="54" rx="8" fill="#FFFFFF" opacity="0.6" />
  </g>

  <!-- Card 3 (Foreground / Active Bar: "The Runner") -->
  <g filter="url(#tile-shadow)" transform="translate(190, 275) skewX(-14) scale(1.05)">
    <rect x="0" y="0" width="245" height="105" rx="22" fill="url(#tile-grad-3)" />
    <rect x="0" y="0" width="245" height="105" rx="22" fill="url(#tile-gloss)" />
    <rect x="0" y="0" width="245" height="105" rx="22" fill="none" stroke="#FEF08A" stroke-width="2.5" stroke-opacity="0.9" />
    <!-- Active Chord Note Stripes -->
    <rect x="30" y="16" width="35" height="73" rx="9" fill="#FFFFFF" opacity="0.95" />
    <rect x="75" y="28" width="35" height="61" rx="9" fill="#FFFFFF" opacity="0.85" />
    <rect x="120" y="10" width="35" height="79" rx="9" fill="#FFFFFF" opacity="0.95" />
    <rect x="165" y="22" width="35" height="67" rx="9" fill="#FFFFFF" opacity="0.75" />
  </g>

  <!-- Vertical Playhead Slicing Across The Progression -->
  <g filter="url(#laser-glow-v9)">
    <line x1="285" y1="80" x2="355" y2="420" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" />
    <line x1="285" y1="80" x2="355" y2="420" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" opacity="0.4" />
    <circle cx="320" cy="250" r="8" fill="#FFFFFF" />
    <circle cx="320" cy="250" r="16" fill="#38BDF8" opacity="0.6" />
  </g>
</svg>
