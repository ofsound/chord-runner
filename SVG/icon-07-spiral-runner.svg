<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0526"/>
      <stop offset="100%" stop-color="#1a0a3e"/>
    </linearGradient>
    <linearGradient id="spiral7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="25%" stop-color="#c084fc"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="75%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <filter id="spiral-glow7">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="dot-glow7">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#c084fc" flood-opacity="0.6"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg7)"/>
  <!-- Fibonacci-like spiral path -->
  <g filter="url(#spiral-glow7)">
    <path d="M256 256 
             Q256 180 310 150 
             Q380 120 400 190 
             Q430 280 360 340 
             Q280 400 200 370 
             Q110 330 120 240 
             Q130 140 220 100 
             Q330 55 410 130 
             Q490 220 460 340" 
          stroke="url(#spiral7)" stroke-width="10" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Chord dots along the spiral - like notes being placed -->
  <g filter="url(#dot-glow7)">
    <circle cx="310" cy="150" r="14" fill="#f472b6"/>
    <ellipse cx="306" cy="146" rx="6" ry="5" fill="white" opacity="0.3"/>
    
    <circle cx="400" cy="190" r="13" fill="#c084fc"/>
    <ellipse cx="396" cy="186" rx="5" ry="4" fill="white" opacity="0.3"/>
    
    <circle cx="360" cy="340" r="12" fill="#818cf8"/>
    <ellipse cx="357" cy="337" rx="5" ry="4" fill="white" opacity="0.3"/>
    
    <circle cx="200" cy="370" r="11" fill="#38bdf8"/>
    <ellipse cx="197" cy="367" rx="5" ry="4" fill="white" opacity="0.3"/>
    
    <circle cx="120" cy="240" r="10" fill="#34d399"/>
    <ellipse cx="118" cy="237" rx="4" ry="3" fill="white" opacity="0.3"/>
  </g>
  <!-- Leading arrow head at spiral end -->
  <g transform="translate(460, 340) rotate(70)">
    <path d="M-12 -8 L0 0 L-12 8" stroke="#34d399" stroke-width="5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- Center pulse -->
  <circle cx="256" cy="256" r="20" fill="#c084fc" opacity="0.15"/>
  <circle cx="256" cy="256" r="10" fill="#c084fc" opacity="0.3"/>
  <circle cx="256" cy="256" r="4" fill="white" opacity="0.6"/>
</svg>
