<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-v5" cx="40%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#1E1333" />
      <stop offset="60%" stop-color="#0E081A" />
      <stop offset="100%" stop-color="#05030A" />
    </radialGradient>

    <!-- Squircle Border -->
    <linearGradient id="border-v5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EC4899" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#8B5CF6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.4" />
    </linearGradient>

    <!-- Chevron Blade 1 (Top/Lead: Electric Cyan to Vivid Azure) -->
    <linearGradient id="blade-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>

    <!-- Chevron Blade 2 (Mid/Harmonic: Neon Indigo to Violet) -->
    <linearGradient id="blade-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818CF8" />
      <stop offset="50%" stop-color="#8B5CF6" />
      <stop offset="100%" stop-color="#6D28D9" />
    </linearGradient>

    <!-- Chevron Blade 3 (Bottom/Bass: Magenta to Hot Coral) -->
    <linearGradient id="blade-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" />
      <stop offset="50%" stop-color="#EC4899" />
      <stop offset="100%" stop-color="#E11D48" />
    </linearGradient>

    <!-- Bevel Lighting Gradients -->
    <linearGradient id="bevel-light" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <filter id="shadow-v5" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="blade-shadow" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="-8" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
      <feDropShadow dx="-2" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.4" />
    </filter>

    <filter id="neon-bloom" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <g filter="url(#shadow-v5)">
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-v5)" />
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="url(#border-v5)" stroke-width="3" />
  </g>

  <!-- Background Ambient Energy Flare -->
  <circle cx="360" cy="256" r="120" fill="#8B5CF6" opacity="0.22" filter="blur(35px)" />

  <!-- 3 Layered Chord Chevrons Stepping Forward in 3D Perspective -->
  <!-- Layer 3: Root / Bottom Blade (Deepest, Behind) -->
  <g filter="url(#blade-shadow)">
    <path d="M 120,115 L 285,256 L 120,397 L 175,397 L 340,256 L 175,115 Z" fill="url(#blade-3)" />
    <!-- Top Edge Highlight -->
    <path d="M 120,115 L 285,256 L 340,256 L 175,115 Z" fill="url(#bevel-light)" opacity="0.25" />
    <line x1="175" y1="115" x2="340" y2="256" stroke="#FFE4E6" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Layer 2: Third / Middle Blade -->
  <g filter="url(#blade-shadow)">
    <path d="M 165,115 L 330,256 L 165,397 L 220,397 L 385,256 L 220,115 Z" fill="url(#blade-2)" />
    <!-- Top Edge Highlight -->
    <path d="M 165,115 L 330,256 L 385,256 L 220,115 Z" fill="url(#bevel-light)" opacity="0.3" />
    <line x1="220" y1="115" x2="385" y2="256" stroke="#EEF2FF" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Layer 1: Fifth / Forefront Apex Blade -->
  <g filter="url(#blade-shadow)">
    <path d="M 210,115 L 375,256 L 210,397 L 265,397 L 430,256 L 265,115 Z" fill="url(#blade-1)" />
    <!-- Top Edge Highlight -->
    <path d="M 210,115 L 375,256 L 430,256 L 265,115 Z" fill="url(#bevel-light)" opacity="0.35" />
    <line x1="265" y1="115" x2="430" y2="256" stroke="#E0F2FE" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- High-Speed Harmonic Light Beam Piercing the Chevrons -->
  <g filter="url(#neon-bloom)">
    <circle cx="430" cy="256" r="8" fill="#FFFFFF" />
    <circle cx="430" cy="256" r="18" fill="#38BDF8" opacity="0.5" />
    <line x1="80" y1="256" x2="430" y2="256" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="14 10" stroke-linecap="round" opacity="0.85" />
  </g>
</svg>
