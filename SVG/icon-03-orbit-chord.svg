<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#0d0d2b"/>
    </linearGradient>
    <linearGradient id="ring1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f472b6"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ring2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fb923c"/>
      <stop offset="50%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="core3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="40%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="core-glow3">
      <feGaussianBlur stdDeviation="15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ring-glow3">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="orb-shadow3">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#f472b6" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg3)"/>
  <!-- Outer ambient -->
  <circle cx="256" cy="256" r="180" fill="#a855f7" opacity="0.04"/>
  <!-- Orbit ring 1 - tilted ellipse -->
  <ellipse cx="256" cy="256" rx="165" ry="60" fill="none" stroke="url(#ring1)" stroke-width="5" 
           transform="rotate(-25, 256, 256)" filter="url(#ring-glow3)" opacity="0.7"/>
  <!-- Orbit ring 2 - different tilt -->
  <ellipse cx="256" cy="256" rx="155" ry="55" fill="none" stroke="url(#ring2)" stroke-width="4" 
           transform="rotate(35, 256, 256)" filter="url(#ring-glow3)" opacity="0.5"/>
  <!-- Orbit ring 3 -->
  <ellipse cx="256" cy="256" rx="140" ry="50" fill="none" stroke="#6366f1" stroke-width="3" 
           transform="rotate(-70, 256, 256)" filter="url(#ring-glow3)" opacity="0.35"/>
  <!-- Central glowing orb -->
  <circle cx="256" cy="256" r="55" fill="url(#core3)" filter="url(#core-glow3)"/>
  <!-- 3D highlight on orb -->
  <ellipse cx="244" cy="240" rx="30" ry="25" fill="white" opacity="0.15"/>
  <!-- Orbiting note spheres -->
  <g filter="url(#orb-shadow3)">
    <!-- Sphere on ring 1 -->
    <circle cx="380" cy="195" r="18" fill="#f472b6"/>
    <ellipse cx="376" cy="190" rx="8" ry="6" fill="white" opacity="0.3"/>
    <!-- Sphere on ring 2 -->
    <circle cx="150" cy="190" r="14" fill="#fb923c"/>
    <ellipse cx="147" cy="187" rx="6" ry="5" fill="white" opacity="0.3"/>
    <!-- Sphere on ring 3 -->
    <circle cx="310" cy="370" r="16" fill="#6366f1"/>
    <ellipse cx="307" cy="367" rx="7" ry="5" fill="white" opacity="0.3"/>
    <!-- Small sphere -->
    <circle cx="190" cy="340" r="10" fill="#a855f7"/>
    <ellipse cx="188" cy="338" rx="4" ry="3" fill="white" opacity="0.3"/>
  </g>
</svg>
