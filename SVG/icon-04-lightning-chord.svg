<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="bolt4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="60%" stop-color="#f472b6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="bolt-edge4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde68a"/>
      <stop offset="100%" stop-color="#f9a8d4"/>
    </linearGradient>
    <filter id="bolt-glow4">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bolt-shadow4">
      <feDropShadow dx="0" dy="0" stdDeviation="20" flood-color="#fbbf24" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg4)"/>
  <!-- Radial burst behind bolt -->
  <g opacity="0.15">
    <line x1="256" y1="256" x2="100" y2="80" stroke="#fbbf24" stroke-width="2"/>
    <line x1="256" y1="256" x2="60" y2="200" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="256" y1="256" x2="420" y2="100" stroke="#fbbf24" stroke-width="2"/>
    <line x1="256" y1="256" x2="460" y2="250" stroke="#fbbf24" stroke-width="1.5"/>
    <line x1="256" y1="256" x2="100" y2="400" stroke="#fbbf24" stroke-width="1"/>
    <line x1="256" y1="256" x2="400" y2="430" stroke="#fbbf24" stroke-width="1"/>
  </g>
  <!-- Main lightning bolt - bold and chunky -->
  <g filter="url(#bolt-shadow4)">
    <path d="M290 60 L200 230 L270 230 L180 450 L340 250 L265 250 Z" 
          fill="url(#bolt4)" filter="url(#bolt-glow4)"/>
    <!-- 3D edge highlight -->
    <path d="M290 60 L200 230 L270 230 L265 250 L340 250 L280 140 Z" 
          fill="url(#bolt-edge4)" opacity="0.3"/>
  </g>
  <!-- Musical note embedded in the bolt center -->
  <g transform="translate(248, 235)" filter="url(#bolt-glow4)">
    <ellipse cx="0" cy="20" rx="16" ry="12" fill="#0f172a" transform="rotate(-15)"/>
    <rect x="13" y="-40" width="5" height="60" rx="2" fill="#0f172a"/>
    <path d="M18 -40 Q35 -32 35 -18 Q35 -4 18 -10" fill="#0f172a"/>
  </g>
  <!-- Sparkle dots -->
  <circle cx="160" cy="150" r="4" fill="#fde68a" opacity="0.7"/>
  <circle cx="370" cy="180" r="3" fill="#fde68a" opacity="0.5"/>
  <circle cx="130" cy="320" r="3" fill="#f9a8d4" opacity="0.4"/>
  <circle cx="390" cy="350" r="4" fill="#f9a8d4" opacity="0.6"/>
  <circle cx="320" cy="100" r="2.5" fill="#fbbf24" opacity="0.6"/>
</svg>
