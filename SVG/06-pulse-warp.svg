<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-v6" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#141026" />
      <stop offset="65%" stop-color="#080612" />
      <stop offset="100%" stop-color="#020105" />
    </radialGradient>

    <!-- Squircle Border -->
    <linearGradient id="border-v6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#C084FC" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.4" />
    </linearGradient>

    <!-- 4 Bar Loop Segment Gradients -->
    <linearGradient id="bar-arc-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#3B82F6" />
    </linearGradient>

    <linearGradient id="bar-arc-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366F1" />
      <stop offset="100%" stop-color="#A855F7" />
    </linearGradient>

    <linearGradient id="bar-arc-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="100%" stop-color="#F43F5E" />
    </linearGradient>

    <linearGradient id="bar-arc-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" />
      <stop offset="100%" stop-color="#FBBF24" />
    </linearGradient>

    <!-- 3D Bevel Sheen -->
    <linearGradient id="ring-sheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <filter id="shadow-v6" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="ring-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="glow-warp" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <g filter="url(#shadow-v6)">
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-v6)" />
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="url(#border-v6)" stroke-width="3" />
  </g>

  <!-- Central Abyss / Sub-bass Core Glow -->
  <ellipse cx="256" cy="256" rx="130" ry="85" fill="#8B5CF6" opacity="0.18" filter="blur(30px)" transform="rotate(-20 256 256)" />

  <!-- 3D Tilted Loop Vortex (4 Chord Progression Segments) -->
  <g filter="url(#ring-shadow)" transform="rotate(-22 256 256)">
    <!-- Back Rim Tube (Depth layer) -->
    <ellipse cx="256" cy="256" rx="150" ry="100" fill="none" stroke="#111827" stroke-width="38" />

    <!-- Arc 1 (Bar 1: Root Chord - Top-Right) -->
    <path d="M 256,156 A 150 100 0 0 1 395,225" fill="none" stroke="url(#bar-arc-1)" stroke-width="34" stroke-linecap="round" />
    <!-- Arc 1 Sheen -->
    <path d="M 256,156 A 150 100 0 0 1 395,225" fill="none" stroke="url(#ring-sheen)" stroke-width="6" stroke-linecap="round" transform="translate(0, -6)" opacity="0.8" />

    <!-- Arc 2 (Bar 2: Second Chord - Bottom-Right) -->
    <path d="M 390,270 A 150 100 0 0 1 270,355" fill="none" stroke="url(#bar-arc-2)" stroke-width="34" stroke-linecap="round" />
    <!-- Arc 2 Sheen -->
    <path d="M 390,270 A 150 100 0 0 1 270,355" fill="none" stroke="url(#ring-sheen)" stroke-width="6" stroke-linecap="round" transform="translate(0, -6)" opacity="0.6" />

    <!-- Arc 3 (Bar 3: Third Chord - Bottom-Left) -->
    <path d="M 230,355 A 150 100 0 0 1 117,280" fill="none" stroke="url(#bar-arc-3)" stroke-width="34" stroke-linecap="round" />
    <!-- Arc 3 Sheen -->
    <path d="M 230,355 A 150 100 0 0 1 117,280" fill="none" stroke="url(#ring-sheen)" stroke-width="6" stroke-linecap="round" transform="translate(0, -6)" opacity="0.6" />

    <!-- Arc 4 (Bar 4: Fourth Chord - Top-Left) -->
    <path d="M 120,230 A 150 100 0 0 1 240,157" fill="none" stroke="url(#bar-arc-4)" stroke-width="34" stroke-linecap="round" />
    <!-- Arc 4 Sheen -->
    <path d="M 120,230 A 150 100 0 0 1 240,157" fill="none" stroke="url(#ring-sheen)" stroke-width="6" stroke-linecap="round" transform="translate(0, -6)" opacity="0.7" />

    <!-- Inner Concentric Harmonic Waveguide -->
    <ellipse cx="256" cy="256" rx="90" ry="55" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-dasharray="10 6" opacity="0.4" />
  </g>

  <!-- High-Speed Playhead Runner Particle Orbiting the Track -->
  <g filter="url(#glow-warp)">
    <!-- Motion streak -->
    <path d="M 320,165 C 380,185 410,240 370,300" fill="none" stroke="#FFFFFF" stroke-width="4" stroke-linecap="round" opacity="0.8" />
    <path d="M 320,165 C 380,185 410,240 370,300" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" opacity="0.4" />

    <!-- Leading Photon / Runner -->
    <circle cx="370" cy="300" r="10" fill="#FFFFFF" />
    <circle cx="370" cy="300" r="22" fill="#38BDF8" opacity="0.5" />
    <circle cx="370" cy="300" r="34" fill="#6366F1" opacity="0.25" />
  </g>
</svg>
