<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-v10" cx="45%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#181333" />
      <stop offset="60%" stop-color="#0A0818" />
      <stop offset="100%" stop-color="#03020A" />
    </radialGradient>

    <!-- Squircle Border -->
    <linearGradient id="border-v10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06B6D4" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.5" />
    </linearGradient>

    <!-- Wing Blade 1 (Bass: Cyan to Royal Blue) -->
    <linearGradient id="wing-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22D3EE" />
      <stop offset="50%" stop-color="#0284C7" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>

    <!-- Wing Blade 2 (Tenor: Violet to Indigo) -->
    <linearGradient id="wing-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7" />
      <stop offset="50%" stop-color="#7C3AED" />
      <stop offset="100%" stop-color="#4338CA" />
    </linearGradient>

    <!-- Wing Blade 3 (Alto: Pink to Crimson) -->
    <linearGradient id="wing-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#9F1239" />
    </linearGradient>

    <!-- Wing Blade 4 (Lead/Apex: Gold to Hot Orange) -->
    <linearGradient id="wing-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>

    <!-- Top Cap Bevel Sheen -->
    <linearGradient id="edge-sheen" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.1" />
    </linearGradient>

    <filter id="shadow-v10" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="wing-depth" x="-30%" y="-20%" width="160%" height="160%">
      <feDropShadow dx="-8" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="speed-flare" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <g filter="url(#shadow-v10)">
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-v10)" />
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="url(#border-v10)" stroke-width="3" />
  </g>

  <!-- Ambient Glow Behind Thrust Apex -->
  <ellipse cx="370" cy="220" rx="100" ry="140" fill="#EC4899" opacity="0.18" filter="blur(35px)" transform="rotate(25 370 220)" />

  <!-- 4 Sweeping Aerodynamic Chord Blades in 3D Staggered Formation -->
  <g filter="url(#wing-depth)">
    <!-- Blade 1 (Lowest / Root / Leftmost) -->
    <g transform="translate(60, 305) scale(0.88)">
      <path d="M 0,55 C 60,55 170,40 250,0 C 180,25 90,35 0,35 Z" fill="url(#wing-1)" />
      <path d="M 0,35 C 90,35 180,25 250,0" stroke="url(#edge-sheen)" stroke-width="2.5" fill="none" />
    </g>

    <!-- Blade 2 (Tenor / Third) -->
    <g transform="translate(85, 245) scale(0.88)">
      <path d="M 0,60 C 70,60 190,42 280,0 C 200,28 100,38 0,38 Z" fill="url(#wing-2)" />
      <path d="M 0,38 C 100,38 200,28 280,0" stroke="url(#edge-sheen)" stroke-width="2.5" fill="none" />
    </g>

    <!-- Blade 3 (Alto / Fifth) -->
    <g transform="translate(110, 185) scale(0.88)">
      <path d="M 0,65 C 80,65 210,44 310,0 C 220,30 110,40 0,40 Z" fill="url(#wing-3)" />
      <path d="M 0,40 C 110,40 220,30 310,0" stroke="url(#edge-sheen)" stroke-width="3" fill="none" />
    </g>

    <!-- Blade 4 (Soprano / Seventh / Apex Lead) -->
    <g transform="translate(135, 125) scale(0.88)">
      <path d="M 0,70 C 90,70 230,46 340,0 C 240,32 120,42 0,42 Z" fill="url(#wing-4)" />
      <path d="M 0,42 C 120,42 240,32 340,0" stroke="#FFFFFF" stroke-width="3.5" fill="none" />
    </g>
  </g>

  <!-- Velocity Thrust Streaks & Playhead Spark -->
  <g filter="url(#speed-flare)">
    <line x1="70" y1="150" x2="160" y2="150" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="12 8" stroke-linecap="round" opacity="0.6" />
    <line x1="55" y1="215" x2="135" y2="215" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="10 8" stroke-linecap="round" opacity="0.5" />
    <line x1="40" y1="280" x2="110" y2="280" stroke="#FFFFFF" stroke-width="3" stroke-dasharray="8 8" stroke-linecap="round" opacity="0.4" />

    <!-- Apex Ignition Spark -->
    <circle cx="434" cy="125" r="7" fill="#FFFFFF" />
    <circle cx="434" cy="125" r="18" fill="#FDE047" opacity="0.6" />
    <circle cx="434" cy="125" r="28" fill="#F97316" opacity="0.3" />
  </g>
</svg>
