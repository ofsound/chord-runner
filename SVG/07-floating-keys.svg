<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-v7" cx="50%" cy="35%" r="75%">
      <stop offset="0%" stop-color="#16192E" />
      <stop offset="60%" stop-color="#0A0C16" />
      <stop offset="100%" stop-color="#04050A" />
    </radialGradient>

    <!-- Squircle Border -->
    <linearGradient id="border-v7" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#818CF8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#F43F5E" stop-opacity="0.4" />
    </linearGradient>

    <!-- Glass Key 1 (Root - Teal/Cyan) -->
    <linearGradient id="key-top-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#06B6D4" stop-opacity="0.75" />
    </linearGradient>

    <!-- Glass Key 2 (Third - Indigo/Violet) -->
    <linearGradient id="key-top-2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A5B4FC" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.75" />
    </linearGradient>

    <!-- Glass Key 3 (Fifth - Hot Magenta) -->
    <linearGradient id="key-top-3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F472B6" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#EC4899" stop-opacity="0.75" />
    </linearGradient>

    <!-- Glass Key 4 (Seventh - Sunset Gold) -->
    <linearGradient id="key-top-4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" stop-opacity="0.95" />
      <stop offset="100%" stop-color="#F59E0B" stop-opacity="0.8" />
    </linearGradient>

    <!-- 3D Slab Thickness / Side Extrusions -->
    <linearGradient id="slab-side-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0891B2" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="slab-side-2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="100%" stop-color="#1E1B4B" />
    </linearGradient>
    <linearGradient id="slab-side-3" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DB2777" />
      <stop offset="100%" stop-color="#500724" />
    </linearGradient>
    <linearGradient id="slab-side-4" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#D97706" />
      <stop offset="100%" stop-color="#451A03" />
    </linearGradient>

    <filter id="shadow-v7" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <filter id="float-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="-10" dy="24" stdDeviation="16" flood-color="#000000" flood-opacity="0.65" />
    </filter>

    <filter id="key-laser" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="glow" />
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <g filter="url(#shadow-v7)">
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-v7)" />
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="url(#border-v7)" stroke-width="3" />
  </g>

  <!-- Ambient Internal Bloom Floor Glows -->
  <ellipse cx="200" cy="360" rx="90" ry="30" fill="#06B6D4" opacity="0.25" filter="blur(20px)" />
  <ellipse cx="320" cy="200" rx="90" ry="30" fill="#F43F5E" opacity="0.25" filter="blur(20px)" />

  <!-- 4 Floating Glass Chord Keys Staggered in 3D Space -->
  <!-- Key 1: Bass / Root (Bottom-Left) -->
  <g filter="url(#float-shadow)" transform="translate(100, 270)">
    <!-- Side extrusion -->
    <path d="M 0,35 L 75,70 L 150,35 L 150,55 L 75,90 L 0,55 Z" fill="url(#slab-side-1)" />
    <!-- Top Face -->
    <polygon points="75,0 150,35 75,70 0,35" fill="url(#key-top-1)" />
    <!-- Rim Highlight -->
    <polygon points="75,0 150,35 75,70 0,35" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.8" />
  </g>

  <!-- Key 2: Third (Center-Left) -->
  <g filter="url(#float-shadow)" transform="translate(150, 215)">
    <!-- Side extrusion -->
    <path d="M 0,35 L 75,70 L 150,35 L 150,55 L 75,90 L 0,55 Z" fill="url(#slab-side-2)" />
    <!-- Top Face -->
    <polygon points="75,0 150,35 75,70 0,35" fill="url(#key-top-2)" />
    <!-- Rim Highlight -->
    <polygon points="75,0 150,35 75,70 0,35" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-opacity="0.85" />
  </g>

  <!-- Key 3: Fifth (Center-Right) -->
  <g filter="url(#float-shadow)" transform="translate(200, 160)">
    <!-- Side extrusion -->
    <path d="M 0,35 L 75,70 L 150,35 L 150,55 L 75,90 L 0,55 Z" fill="url(#slab-side-3)" />
    <!-- Top Face -->
    <polygon points="75,0 150,35 75,70 0,35" fill="url(#key-top-3)" />
    <!-- Rim Highlight -->
    <polygon points="75,0 150,35 75,70 0,35" fill="none" stroke="#FFFFFF" stroke-width="2.5" stroke-opacity="0.9" />
  </g>

  <!-- Key 4: Seventh / Active Chord Runner (Top-Right) -->
  <g filter="url(#float-shadow)" transform="translate(250, 105)">
    <!-- Side extrusion -->
    <path d="M 0,35 L 75,70 L 150,35 L 150,55 L 75,90 L 0,55 Z" fill="url(#slab-side-4)" />
    <!-- Top Face -->
    <polygon points="75,0 150,35 75,70 0,35" fill="url(#key-top-4)" />
    <!-- Active Glow Flare on Top -->
    <polygon points="75,0 150,35 75,70 0,35" fill="#FFFFFF" opacity="0.3" />
    <!-- Rim Highlight -->
    <polygon points="75,0 150,35 75,70 0,35" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-opacity="0.95" />
  </g>

  <!-- Kinetic Playhead Ray Sweeping Through the Keys -->
  <g filter="url(#key-laser)">
    <line x1="80" y1="360" x2="430" y2="120" stroke="#FFFFFF" stroke-width="3.5" stroke-linecap="round" />
    <line x1="80" y1="360" x2="430" y2="120" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" opacity="0.4" />
    <!-- Sounding Node on the top key -->
    <circle cx="325" cy="190" r="7" fill="#FFFFFF" />
    <circle cx="325" cy="190" r="16" fill="#FBBF24" opacity="0.6" />
  </g>
</svg>
