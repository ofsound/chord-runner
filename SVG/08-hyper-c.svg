<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bg-v8" cx="45%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#191330" />
      <stop offset="60%" stop-color="#0B0817" />
      <stop offset="100%" stop-color="#04020A" />
    </radialGradient>

    <!-- Squircle Border -->
    <linearGradient id="border-v8" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.5" />
      <stop offset="50%" stop-color="#EC4899" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#6366F1" stop-opacity="0.5" />
    </linearGradient>

    <!-- Outer Arc Stream (Root: Electric Indigo to Vivid Violet) -->
    <linearGradient id="c-stream-1" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="30%" stop-color="#6366F1" />
      <stop offset="70%" stop-color="#A855F7" />
      <stop offset="100%" stop-color="#EC4899" />
    </linearGradient>

    <!-- Mid Arc Stream (Third: Hot Fuchsia to Sunset Coral) -->
    <linearGradient id="c-stream-2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F43F5E" />
      <stop offset="50%" stop-color="#FB7185" />
      <stop offset="100%" stop-color="#FB923C" />
    </linearGradient>

    <!-- Inner Arc Stream (Fifth: Warm Gold to Cyber Lime) -->
    <linearGradient id="c-stream-3" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE047" />
      <stop offset="50%" stop-color="#FBBF24" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <linearGradient id="sheen-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
    </linearGradient>

    <filter id="shadow-v8" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="c-depth" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="-6" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.7" />
    </filter>

    <filter id="laser-flare" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="flare" />
      <feMerge>
        <feMergeNode in="flare" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <g filter="url(#shadow-v8)">
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="url(#bg-v8)" />
    <rect x="32" y="32" width="448" height="448" rx="104" ry="104" fill="none" stroke="url(#border-v8)" stroke-width="3" />
  </g>

  <!-- Ambient Flare -->
  <circle cx="180" cy="256" r="130" fill="#6366F1" opacity="0.18" filter="blur(30px)" />

  <!-- The 3D Sculptural Hyper-C Chord Streams -->
  <g filter="url(#c-depth)">
    <!-- Stream 1 (Outer Chord Track: Bass) -->
    <path d="M 380,140 C 210,90 110,170 110,256 C 110,342 210,422 380,372" 
          fill="none" stroke="url(#c-stream-1)" stroke-width="38" stroke-linecap="round" />
    <!-- Stream 1 Rim Light -->
    <path d="M 360,126 C 200,80 115,160 115,240" 
          fill="none" stroke="url(#sheen-grad)" stroke-width="4" stroke-linecap="round" opacity="0.7" />

    <!-- Stream 2 (Middle Chord Track: Third) -->
    <path d="M 350,185 C 230,150 160,200 160,256 C 160,312 230,362 350,327" 
          fill="none" stroke="url(#c-stream-2)" stroke-width="26" stroke-linecap="round" />
    <!-- Stream 2 Rim Light -->
    <path d="M 340,175 C 230,145 165,195 165,245" 
          fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.8" />

    <!-- Stream 3 (Inner Chord Track: Fifth) -->
    <path d="M 320,230 C 260,210 210,230 210,256 C 210,282 260,302 320,282" 
          fill="none" stroke="url(#c-stream-3)" stroke-width="16" stroke-linecap="round" />
  </g>

  <!-- Speed Dash / Playhead Thrust Vector -->
  <g filter="url(#laser-flare)">
    <polygon points="385,140 330,115 345,140 330,165" fill="#38BDF8" />
    <circle cx="385" cy="140" r="9" fill="#FFFFFF" />
    <circle cx="385" cy="140" r="18" fill="#38BDF8" opacity="0.5" />
    <polygon points="385,372 340,352 350,372 340,392" fill="#EC4899" />
  </g>
</svg>
