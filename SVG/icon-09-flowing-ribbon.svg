<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg9" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1628"/>
      <stop offset="100%" stop-color="#162032"/>
    </linearGradient>
    <linearGradient id="ribbon9a" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="ribbon9b" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="50%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="ribbon9c" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="ribbon-glow9">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ribbon-shadow9">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#a855f7" flood-opacity="0.3"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg9)"/>
  <!-- Three flowing ribbons representing chord voices -->
  <g filter="url(#ribbon-shadow9)">
    <!-- Ribbon 1 - top voice -->
    <path d="M50 180 C120 120 180 160 220 140 C260 120 300 80 360 120 C420 160 440 130 480 150" 
          stroke="url(#ribbon9b)" stroke-width="22" fill="none" stroke-linecap="round"
          filter="url(#ribbon-glow9)"/>
    <!-- Ribbon 1 highlight -->
    <path d="M50 180 C120 120 180 160 220 140 C260 120 300 80 360 120 C420 160 440 130 480 150" 
          stroke="white" stroke-width="22" fill="none" stroke-linecap="round" opacity="0.08"/>
    
    <!-- Ribbon 2 - middle voice -->
    <path d="M30 280 C100 240 160 300 220 270 C280 240 330 260 380 240 C430 220 460 260 490 250" 
          stroke="url(#ribbon9a)" stroke-width="26" fill="none" stroke-linecap="round"
          filter="url(#ribbon-glow9)"/>
    <path d="M30 280 C100 240 160 300 220 270 C280 240 330 260 380 240 C430 220 460 260 490 250" 
          stroke="white" stroke-width="26" fill="none" stroke-linecap="round" opacity="0.06"/>
    
    <!-- Ribbon 3 - bass voice -->
    <path d="M40 380 C110 340 170 400 240 370 C310 340 350 380 400 360 C450 340 470 370 500 360" 
          stroke="url(#ribbon9c)" stroke-width="20" fill="none" stroke-linecap="round"
          filter="url(#ribbon-glow9)"/>
    <path d="M40 380 C110 340 170 400 240 370 C310 340 350 380 400 360 C450 340 470 370 500 360" 
          stroke="white" stroke-width="20" fill="none" stroke-linecap="round" opacity="0.08"/>
  </g>
  <!-- Forward motion particles -->
  <circle cx="470" cy="148" r="6" fill="#f97316" opacity="0.7"/>
  <circle cx="480" cy="248" r="7" fill="#a855f7" opacity="0.7"/>
  <circle cx="490" cy="358" r="5" fill="#3b82f6" opacity="0.7"/>
  <!-- Speed trail particles -->
  <circle cx="60" cy="182" r="3" fill="#f97316" opacity="0.3"/>
  <circle cx="40" cy="282" r="3" fill="#ec4899" opacity="0.3"/>
  <circle cx="50" cy="382" r="3" fill="#06b6d4" opacity="0.3"/>
</svg>
